<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FA8C8"/>
      <stop offset="0.55" stop-color="#B8DCF0"/>
      <stop offset="1" stop-color="#FBE8C8"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBF8"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AD17C"/>
      <stop offset="1" stop-color="#6FAE5C"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- gökyüzü: soğuk maviden sıcak şeftaliye geçiş -->
  <rect width="460" height="620" fill="url(#sky)"/>
  <circle cx="352" cy="96" r="110" fill="url(#sunGlow)"/>
  <circle cx="352" cy="96" r="34" fill="#FFD97A"/>

  <!-- kar tarafı (sol) -->
  <path d="M0 400 Q 115 370 230 408 L230 620 L0 620 Z" fill="url(#snow)"/>
  <ellipse cx="70" cy="548" rx="150" ry="34" fill="#FFFFFF" opacity="0.7"/>

  <!-- çam ağaçları (sol) -->
  <rect x="88" y="330" width="14" height="70" rx="4" fill="#5B4432"/>
  <path d="M95 240 L150 340 L40 340 Z" fill="#3F5D4B"/>
  <path d="M95 280 L135 360 L55 360 Z" fill="#47684F"/>
  <path d="M95 320 L125 382 L65 382 Z" fill="#3F5D4B"/>
  <path d="M40 340 Q95 316 150 340 Q95 332 40 340 Z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M55 360 Q95 340 135 360 Q95 352 55 360 Z" fill="#FFFFFF" opacity="0.85"/>

  <!-- bahar tarafı (sağ) -->
  <path d="M230 408 Q 345 370 460 400 L460 620 L230 620 Z" fill="url(#grass)"/>
  <ellipse cx="360" cy="560" rx="140" ry="30" fill="#8CCB6A"/>

  <!-- kiraz ağacı (sağ) -->
  <path d="M360 560 Q 352 430 372 340" stroke="#6B4A32" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M372 340 Q 322 300 288 330" stroke="#6B4A32" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M372 340 Q 430 300 448 340" stroke="#6B4A32" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="330" cy="290" r="34" fill="#F9C6D8"/>
  <circle cx="392" cy="282" r="40" fill="#F7B7CD"/>
  <circle cx="452" cy="318" r="28" fill="#FCE4EC"/>
  <circle cx="300" cy="322" r="26" fill="#F9C6D8"/>
  <circle cx="330" cy="290" r="34" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="280" cy="560" r="9" fill="#F2C14E"/>
  <circle cx="420" cy="580" r="10" fill="#B57EDC"/>
  <circle cx="330" cy="588" r="8" fill="#F48FB1"/>
  <circle cx="455" cy="560" r="8" fill="#F2C14E"/>

  <!-- geçiş: ortada kıştan bahara akan dere -->
  <path d="M230 170 Q 240 260 224 360 Q 212 470 232 620" stroke="#FFFFFF" stroke-width="42" fill="none" opacity="0.85" stroke-linecap="round"/>
  <path d="M230 170 Q 240 260 224 360 Q 212 470 232 620" stroke="#BDE3F5" stroke-width="16" fill="none" opacity="0.9" stroke-linecap="round"/>

  <!-- kar taneleri -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="60" cy="90" r="5"/><circle cx="130" cy="150" r="4"/>
    <circle cx="40" cy="220" r="6"/><circle cx="170" cy="90" r="4"/>
    <circle cx="110" cy="240" r="3"/><circle cx="70" cy="320" r="4"/>
  </g>
  <!-- uçuşan çiçek yaprakları -->
  <g fill="#FFE0EC">
    <circle cx="420" cy="420" r="4"/><circle cx="450" cy="380" r="3"/>
    <circle cx="300" cy="420" r="4"/><circle cx="360" cy="450" r="3"/>
    <circle cx="440" cy="460" r="4"/>
  </g>
</svg>
